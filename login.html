<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILZ Admin — Entrar</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0E0E0E;
      color: #E8E4DE;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    a { color: inherit; text-decoration: none; }

    :root {
      --bronze: #B08D57;
      --bronze-dim: rgba(176,141,87,0.15);
      --bg: #0E0E0E;
      --bg2: #161616;
      --bg3: #1E1E1E;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #E8E4DE;
      --text-dim: #7A756E;
      --text-muted: #3D3A35;
      --radius: 6px;
      --transition: 0.2s ease;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-brand__name {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--text);
    }
    .login-brand__sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .login-form { display: flex; flex-direction: column; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    input[type="password"],
    input[type="email"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      padding: 12px 14px;
      outline: none;
      transition: border-color var(--transition);
    }
    input:focus { border-color: rgba(176,141,87,0.5); }
    input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
      transition: all var(--transition);
      cursor: pointer;
      width: 100%;
    }
    .btn-primary {
      background: var(--bronze);
      color: #0E0E0E;
      border-color: var(--bronze);
    }
    .btn-primary:hover { background: #C9A468; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      font-size: 13px;
      color: #C46A6A;
      text-align: center;
      min-height: 20px;
    }

    .forgot-link {
      text-align: center;
    }
    .forgot-link button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: color var(--transition);
      font-family: inherit;
    }
    .forgot-link button:hover { color: var(--bronze); }

    .register-link {
      text-align: center;
      margin-top: 12px;
    }
    .register-link a {
      color: var(--text-dim);
      font-size: 12px;
      transition: color var(--transition);
    }
    .register-link a:hover { color: var(--bronze); }

    .forgot-section {
      display: none;
      margin-top: 4px;
    }
    .forgot-section.open {
      display: block;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0 20px;
    }

    .forgot-desc {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 16px;
      text-align: center;
    }

    .back-link {
      text-align: center;
      margin-top: 12px;
    }
    .back-link button {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: color var(--transition);
      font-family: inherit;
    }
    .back-link button:hover { color: var(--text); }

    .toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s ease;
      pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(90,154,106,0.4); }
    .toast.error   { border-color: rgba(154,90,90,0.4); }
    .toast__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .toast.success .toast__dot { background: #5A9A6A; }
    .toast.error   .toast__dot { background: #9A5A5A; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand__name">FILZ</div>
      <div class="login-brand__sub">Painel Administrativo</div>
    </div>

    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" autofocus>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
    </form>

    <hr class="divider">

    <div class="forgot-link">
      <button type="button" id="btn-show-forgot">Esqueceu a senha?</button>
    </div>

    <div class="register-link">
      <a href="/register.html">Criar conta</a>
    </div>

    <div class="forgot-section" id="forgot-section">
      <p class="forgot-desc">Informe seu e-mail cadastrado para receber a senha de acesso.</p>
      <form id="forgot-form">
        <div class="form-group" style="margin-bottom:16px;">
          <label for="forgot-email">E-mail</label>
          <input type="email" id="forgot-email" placeholder="contato@filz.com.br" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary" id="btn-forgot">Enviar</button>
      </form>
      <div class="back-link">
        <button type="button" id="btn-back-login">Voltar ao login</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script>
    const $ = id => document.getElementById(id);

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = $('password').value;
      const btn = $('btn-login');
      const err = $('error-msg');

      if (!password) { err.textContent = 'Digite a senha.'; return; }
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/admin.html';
        } else {
          err.textContent = data.message || 'Senha incorreta.';
        }
      } catch {
        err.textContent = 'Erro de conexão.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    $('btn-show-forgot').addEventListener('click', () => {
      $('login-form').style.display = 'none';
      $('btn-show-forgot').style.display = 'none';
      document.querySelector('.register-link').style.display = 'none';
      $('forgot-section').classList.add('open');
    });

    $('btn-back-login').addEventListener('click', () => {
      $('login-form').style.display = 'flex';
      $('btn-show-forgot').style.display = 'block';
      document.querySelector('.register-link').style.display = 'block';
      $('forgot-section').classList.remove('open');
      $('error-msg').textContent = '';
    });

    $('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('forgot-email').value;
      const btn = $('btn-forgot');

      if (!email) { showToast('Digite seu e-mail.', 'error'); return; }
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.ok) {
          showToast('E-mail enviado! Verifique sua caixa de entrada.', 'success');
          $('forgot-email').value = '';
          $('btn-back-login').click();
        } else {
          showToast(data.message || 'Erro ao enviar.', 'error');
        }
      } catch {
        showToast('Erro de conexão.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    });

    function showToast(msg, type = 'success') {
      const wrap = $('toasts');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<div class="toast__dot"></div>${escH(msg)}`;
      wrap.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
      }, 3500);
    }

    function escH(str = '') {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
