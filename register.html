<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FILZ Admin — Criar Conta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0E0E0E;
      color: #E8E4DE;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }
    a { color: inherit; text-decoration: none; }

    :root {
      --bronze: #B08D57;
      --bronze-dim: rgba(176,141,87,0.15);
      --bg: #0E0E0E;
      --bg2: #161616;
      --bg3: #1E1E1E;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #E8E4DE;
      --text-dim: #7A756E;
      --text-muted: #3D3A35;
      --radius: 6px;
      --transition: 0.2s ease;
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand__name {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--text);
    }
    .brand__sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .form { display: flex; flex-direction: column; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      padding: 12px 14px;
      outline: none;
      transition: border-color var(--transition);
    }
    input:focus { border-color: rgba(176,141,87,0.5); }
    input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
      transition: all var(--transition);
      cursor: pointer;
      width: 100%;
    }
    .btn-primary {
      background: var(--bronze);
      color: #0E0E0E;
      border-color: var(--bronze);
    }
    .btn-primary:hover { background: #C9A468; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      font-size: 13px;
      color: #C46A6A;
      text-align: center;
      min-height: 20px;
    }
    .success-msg {
      font-size: 13px;
      color: #5A9A6A;
      text-align: center;
      display: none;
    }

    .footer-link {
      text-align: center;
      margin-top: 16px;
    }
    .footer-link a {
      color: var(--text-dim);
      font-size: 12px;
      transition: color var(--transition);
    }
    .footer-link a:hover { color: var(--bronze); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand__name">FILZ</div>
      <div class="brand__sub">Criar Conta Administrativa</div>
    </div>

    <form class="form" id="register-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="contato@filz.com.br" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Crie uma senha" autocomplete="new-password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirm">Confirmar senha</label>
        <input type="password" id="confirm" placeholder="Repita a senha" autocomplete="new-password" required>
      </div>
      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg">
        Conta criada! <a href="/login.html" style="color:var(--bronze);text-decoration:underline;">Fazer login</a>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-register">Criar conta</button>
    </form>

    <div class="footer-link">
      <a href="/login.html">Já tem conta? Faça login</a>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    $('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      const confirm = $('confirm').value;
      const err = $('error-msg');
      const success = $('success-msg');
      const btn = $('btn-register');

      err.textContent = '';
      success.style.display = 'none';

      if (!email) { err.textContent = 'Digite seu e-mail.'; return; }
      if (password.length < 6) { err.textContent = 'A senha deve ter no mínimo 6 caracteres.'; return; }
      if (password !== confirm) { err.textContent = 'As senhas não conferem.'; return; }

      btn.disabled = true;
      btn.textContent = 'Criando...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.ok) {
          $('register-form').style.display = 'none';
          success.style.display = 'block';
        } else {
          err.textContent = data.message || 'Erro ao criar conta.';
        }
      } catch {
        err.textContent = 'Erro de conexão.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
